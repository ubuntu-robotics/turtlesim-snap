name: turtlesim-snap
base: core24
version: '1.0.0'
summary: ROS 2 turtlesim as a snap
description: |
  Snap package for the ROS 2 turtlesim graphical demo application.

  This snap exposes an app entrypoint that launches turtlesim_node.
license: BSD-3-Clause
grade: stable
confinement: strict

platforms:
  amd64:
  arm64:

parts:
  turtlesim-runtime:
    plugin: nil
    stage-packages:
      - ros-jazzy-turtlesim
      # Ensure Qt/X11 platform plugins are staged for headless CI and desktop runs.
      - libqt5gui5
      - libqt5widgets5
      - libqt5core5a
      - libqt5dbus5
      - qtwayland5
      - qt5-gtk-platformtheme
      - libxkbcommon-x11-0
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render-util0
      - libxcb-xinerama0
      - libxcb-xinput0
      - libxcb-xkb1

apps:
  turtlesim:
    command: opt/ros/jazzy/lib/turtlesim/turtlesim_node
    extensions:
      - ros2-jazzy
      - gnome
    plugs:
      - network
      - network-bind
      - opengl
      - wayland
      - x11
