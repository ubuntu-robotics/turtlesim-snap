name: turtlesim
base: core24
version: '1.0.0'
summary: ROS 2 turtlesim as a snap
description: |
  Snap package for the ROS 2 turtlesim graphical demo application.

  This snap exposes an app entrypoint that launches turtlesim_node.
license: BSD-3-Clause
grade: stable
confinement: strict

platforms:
  amd64:
  arm64:

parts:
  launcher:
    plugin: dump
    source: .
    organize:
      snap/local/turtlesim-launch: bin/turtlesim-launch

  turtlesim-runtime:
    plugin: nil
    stage-packages:
      - ros-jazzy-turtlesim
      - qtwayland5
      - libqt5waylandclient5

apps:
  turtlesim:
    command: bin/turtlesim-launch
    extensions:
      - ros2-jazzy
      - gnome
